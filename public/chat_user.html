<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - HOMMIE</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/chat_user.css">
    <!-- Incluir Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <h1>HOMMIE</h1>
        </div>
        <nav class="user-nav">
            <i class="fas fa-user-circle profile-icon" title="Editar Perfil"></i>
            <i class="fas fa-sign-out-alt logout-icon" title="Sair"></i>
        </nav>
    </header>

    <div class="main-content">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-list"></i> Listagem</a>
                <a href="dashboard.html"><i class="fas fa-star"></i> Favoritos</a>
                <a href="chats.html"><i class="fas fa-comments"></i> Chats</a>
            </nav>
        </aside>

        <main class="chat-user-container">
            <!-- Cabeçalho do Chat -->
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-avatar"></div>
                    <h2 id="hostName">Carregando...</h2>
                </div>
                <button class="exit-chat-btn" id="exitChatBtn">Sair</button>
            </div>

            <!-- Área de Mensagens -->
            <div class="chat-messages" id="chatMessages">
                <p class="loading-message">Carregando mensagens...</p>
            </div>

            <!-- Área de Entrada de Mensagem -->
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." class="message-input">
                <button id="sendBtn" class="send-btn">Enviar</button>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/chat_user.js"></script>
</body>
</html>
