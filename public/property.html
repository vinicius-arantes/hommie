<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="propertyTitle">Detalhes do Imóvel - HOMMIE</title>
    <link rel="stylesheet" href="css/dashboard.css"> <!-- Reutiliza o CSS do Dashboard para Header/Sidebar -->
    <link rel="stylesheet" href="css/property.css">
    <!-- Incluir Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <h1>HOMMIE</h1>
        </div>
        <nav class="user-nav">
            <i class="fas fa-user-circle profile-icon" title="Editar Perfil"></i>
            <i class="fas fa-sign-out-alt logout-icon" title="Sair"></i>
        </nav>
    </header>

    <div class="main-content">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active"><i class="fas fa-list"></i> Listagem</a>
                <a href="dashboard.html"><i class="fas fa-star"></i> Favoritos</a>
                <a href="chats.html"><i class="fas fa-comments"></i> Chats</a>
            </nav>
        </aside>

        <main class="property-container">
            <div class="back-button-container">
                <a href="dashboard.html" class="back-button"><i class="fas fa-arrow-left"></i></a>
            </div>

            <div id="propertyDetails">
                <!-- Conteúdo do Imóvel será carregado aqui -->
                <p class="loading-message">Carregando detalhes do imóvel...</p>
            </div>
        </main>
    </div>

    <!-- Modal de Solicitação -->
    <div id="requestModalOverlay" class="request-modal-overlay">
        <div class="request-modal">
            <div class="modal-header">
                <i class="fas fa-pen"></i>
                <h3>Solicitação</h3>
            </div>

            <form id="requestForm">
                <div class="modal-input-group select-wrapper">
                    <label>Tipo:</label>
                    <select name="type_select" id="type_select" class="custom-select">
                        <option value="">Selecione</option>
                        <option value="Compra">Compra</option>
                        <option value="Aluguel">Aluguel</option>
                        <option value="Fim de Vínculo">Fim de Vínculo</option>
                    </select>
                </div>
                <button type="submit" class="modal-request-button">Solicitar</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/property.js"></script>
</body>
</html>
