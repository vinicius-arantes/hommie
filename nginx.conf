server {
    listen 80;
    server_name localhost;
    root /var/www/html/public; # Define a pasta 'public' como a raiz do servidor web

    index index.html index.php;

    location / {
        try_files $uri $uri/ /index.html; # Tenta servir o arquivo, se não existir, cai no index.html
    }

    # Passar requisições PHP para o PHP-FPM
    location ~ \.php$ {
        # O Nginx está servindo a partir de /var/www/html/public.
        # O caminho para os controladores é /var/www/html/src/controllers/
        # Para acessar um controlador como LoginController.php, a URL é:
        # http://localhost:8080/../src/controllers/LoginController.php
        # O Nginx precisa reescrever o caminho para que o PHP-FPM encontre o arquivo correto.

        # A requisição AJAX é feita para: ../src/controllers/LoginController.php
        # O Nginx, servindo de /public, vê o caminho como /src/controllers/LoginController.php

        # 1. Bloquear acesso direto a arquivos PHP que não sejam controladores
        # A URL que chega ao Nginx é /src/controllers/LoginController.php
        # O $uri é /src/controllers/LoginController.php
        if ($uri !~ "^/src/controllers/") {
            return 404;
        }

        # 2. Configuração padrão para PHP-FPM
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000; # 'php' é o nome do serviço no docker-compose
        fastcgi_index index.php;
        include fastcgi_params;
        # O SCRIPT_FILENAME deve apontar para o arquivo real no sistema de arquivos do container
        # O root do Nginx é /var/www/html/public, mas o arquivo está em /var/www/html/src/controllers/
        # O $document_root é /var/www/html/public
        # O $fastcgi_script_name é /src/controllers/LoginController.php
        # O caminho real é /var/www/html/src/controllers/LoginController.php
        # Precisamos remover o /public do $document_root para que o caminho funcione.
        # Uma forma mais simples é definir o SCRIPT_FILENAME diretamente:
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Bloquear acesso direto a arquivos de configuração e código-fonte
    location ~ ^/(config|src|vendor)/ {
        deny all;
        return 404;
    }
}
